[package]
name = "rustsat-esa"
version = "0.1.0"
edition = "2021"
authors = ["s7g4"]
description = "SpaceCAN-compatible CubeSat communication protocol stack for ESA missions"
license = "MIT"
repository = "https://github.com/esa/rustsat-esa"
homepage = "https://esa.int/rustsat-esa"
documentation = "https://docs.rs/rustsat-esa"
keywords = ["cubesat", "space", "communication", "protocol", "esa"]
categories = ["aerospace::space-protocols", "embedded", "network-programming"]
readme = "README.md"
rust-version = "1.70"
exclude = ["config/", "benches/", "docs/", "DEVLOG.md", ".github/"]

[lib]
name = "rustsat_esa"
path = "src/lib.rs"

[features]
default = ["defmt"]
simulation = []

[dependencies]
heapless = "0.8"
defmt = { version = "0.3", optional = true }

[dev-dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
cortex-m-semihosting = "0.5.0"
panic-semihosting = "0.6.0"
defmt-rtt = "0.4.0"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
